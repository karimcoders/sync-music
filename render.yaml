# One-click permanent backend: https://render.com/deploy?repo=https://github.com/karimcoders/sync-music
# Render's free web service supports HTTPS + WebSockets and gives a permanent
# *.onrender.com URL. It sleeps after ~15 min idle (first request wakes it in
# under a minute) — fine for testing, upgrade the plan for events.
services:
  - type: web
    name: sync-music-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: SERVE_WEB
        value: "true"
      - key: WEB_DIR
        value: /app/web
      - key: DATA_DIR
        value: /data
      # Secrets are generated by Render, never committed anywhere.
      - key: TOKEN_SECRET
        generateValue: true
      - key: AUDIO_URL_SECRET
        generateValue: true
      # Infrastructure guard only — NOT a product speaker limit.
      - key: MAX_CONNECTIONS_PER_INSTANCE
        value: "2000"
    disk:
      name: audio
      mountPath: /data
      sizeGB: 1
